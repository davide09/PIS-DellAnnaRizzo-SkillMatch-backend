.docker-build-template:
  stage: package
  image: docker:24
  services:
    - docker:24-dind
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
  before_script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
  only:
    - main

package-user-service:
  extends: .docker-build-template
  script:
    - docker build -t "$CI_REGISTRY_IMAGE/user-service:$CI_COMMIT_SHORT_SHA" -t "$CI_REGISTRY_IMAGE/user-service:latest" ./user-service
    - docker push "$CI_REGISTRY_IMAGE/user-service:$CI_COMMIT_SHORT_SHA"
    - docker push "$CI_REGISTRY_IMAGE/user-service:latest"

package-gateway-service:
  extends: .docker-build-template
  script:
    - docker build -t "$CI_REGISTRY_IMAGE/gateway-service:$CI_COMMIT_SHORT_SHA" -t "$CI_REGISTRY_IMAGE/gateway-service:latest" ./gateway-service
    - docker push "$CI_REGISTRY_IMAGE/gateway-service:$CI_COMMIT_SHORT_SHA"
    - docker push "$CI_REGISTRY_IMAGE/gateway-service:latest"

