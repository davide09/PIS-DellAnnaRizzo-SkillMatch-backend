variables:
  MAVEN_OPTS: "-Dmaven.repo.local=$CI_PROJECT_DIR/.m2/repository"

cache:
  key: "$CI_COMMIT_REF_SLUG"
  paths:
    - .m2/repository

stages:
  - build-base
  - build-dependent
  - package


build-shared-and-user:
  stage: build-base
  image: maven:3.9-eclipse-temurin-17
  script:
    - cd skillmatch-events && mvn $MAVEN_OPTS -B clean install && cd ..
    - cd user-service && mvn $MAVEN_OPTS -B clean package && cd ..
  artifacts:
    paths:
      - user-service/target/*.jar
    expire_in: 1 hour

build-gateway-service:
  stage: build-base
  image: maven:3.9-eclipse-temurin-17
  script:
    - cd gateway-service && mvn $MAVEN_OPTS -B clean package
  artifacts:
    paths:
      - gateway-service/target/*.jar
    expire_in: 1 hour

build-project-service:
  stage: build-base
  image: maven:3.9-eclipse-temurin-17
  script:
    - cd project-service && mvn $MAVEN_OPTS -B clean package
  artifacts:
    paths:
      - project-service/target/*.jar
    expire_in: 1 hour


build-contract-service:
  stage: build-dependent
  image: maven:3.9-eclipse-temurin-17
  script:
    - cd contract-service && mvn $MAVEN_OPTS -B clean package
  artifacts:
    paths:
      - contract-service/target/*.jar
    expire_in: 1 hour

