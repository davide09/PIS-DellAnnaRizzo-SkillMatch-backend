server:
  port: 8080

spring:
  main:
    web-application-type: reactive   # Gateway deve essere REACTIVE

  cloud:
    gateway:

      # ========== CORS GLOBALI ==========
      globalcors:
        add-to-simple-url-handler-mapping: true
        corsConfigurations:
          '[/**]':
            allowedOrigins:
              - "http://localhost:5173"
            allowedMethods: "*"
            allowedHeaders: "*"
            allowCredentials: true

      # Evita duplicazioni header CORS
      default-filters:
        - DedupeResponseHeader=Access-Control-Allow-Credentials Access-Control-Allow-Origin
        - PreserveHostHeader
        - RemoveResponseHeader=Content-Length

      # ========== ROUTES ==========
      routes:

        # --- USER SERVICE (auth + utente) ---
        - id: user-service
          uri: http://user-service:8083
          predicates:
            # ⚠ UN SOLO Path CON ENTRAMBI I PATTERN (OR logico)
            - Path=/api/auth/**,/api/users/**

        # --- PROJECT SERVICE ---
        - id: project-service
          uri: http://project-service:8081
          predicates:
            - Path=/api/projects/**

        # --- CONTRACT SERVICE ---
        - id: contract-service
          uri: http://contract-service:8082
          predicates:
            - Path=/api/contracts/**
          filters:
            - PreserveHostHeader
            - RemoveResponseHeader=Content-Length

        # --- MATCHING SERVICE ---
        - id: matching-service
          uri: http://matching-service:8084
          predicates:
            - Path=/api/matching/**

        # --- WALLET SERVICE ---
        - id: wallet-service
          uri: http://wallet-service:8087
          predicates:
            - Path=/api/wallet/**,/api/admin/wallet/**,/api/admin/wallet/transactions/**,/api/admin/wallet/transactions/filter/**
          filters:
            - PreserveHostHeader
            - RemoveResponseHeader=Content-Length

logging:
  level:
    org.springframework.cloud.gateway: DEBUG