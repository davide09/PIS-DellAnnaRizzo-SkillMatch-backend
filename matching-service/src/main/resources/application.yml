server:
  port: 8084

matching:
  project-service-url: http://project-service:8081/api/projects/internal
  user-service-url: http://user-service:8083/api/users/internal

spring:
  main:
    allow-bean-definition-overriding: true

  rabbitmq:
    host: rabbitmq
    port: 5672
    username: ${RABBITMQ_USER}
    password: ${RABBITMQ_PASSWORD}

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html