server:
  port: 8087

spring:
  datasource:
    url: jdbc:postgresql://wallet-db:5432/skillmatch_wallets
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

  rabbitmq:
    host: rabbitmq
    port: 5672
    username: ${RABBITMQ_USER}
    password: ${RABBITMQ_PASSWORD}

logging:
  level:
    org.springframework.amqp: DEBUG
    org.springframework.rabbit: DEBUG