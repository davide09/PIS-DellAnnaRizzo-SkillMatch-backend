server:
  port: 8082

spring:
  application:
    name: contract-service

  datasource:
    url: jdbc:postgresql://contract-db:5432/skillmatch_contracts
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  rabbitmq:
    host: rabbitmq
    port: 5672
    username: ${RABBITMQ_USER}
    password: ${RABBITMQ_PASSWORD}

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html

contract:
  user-service-url: http://user-service:8083/api/users/internal
  project-service-url: http://project-service:8081/api/projects/internal